<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Tree Grant Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: white;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #C75B39 0%, #A64B2E 100%);
            color: #FDF8F0;
            padding: 20px;
            text-align: center;
            display: none;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            display: flex;
            justify-content: flex-start;
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
        }

        .message.bot .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: #C75B39;
            color: #FDF8F0;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            padding: 12px 16px;
            border: 2px solid #C75B39;
            background: white;
            color: #C75B39;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
            min-height: 48px;
        }

        button:hover {
            background: #C75B39;
            color: #FDF8F0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.selected {
            background: #C75B39;
            color: #FDF8F0;
            border-color: #A64B2E;
            box-shadow: 0 0 0 3px rgba(199, 91, 57, 0.2);
        }

        button.done-button {
            background: #7A9E7E;
            border-color: #7A9E7E;
            color: white;
            font-weight: 600;
        }

        button.done-button:hover {
            background: #5C7A5F;
            border-color: #5C7A5F;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 8px;
        }

        input:focus {
            outline: none;
            border-color: #C75B39;
        }

        .submit-btn {
            background: #C75B39;
            color: #FDF8F0;
            border: none;
            width: 100%;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #A64B2E;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #C75B39;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .link {
            color: #2563eb;
            text-decoration: underline;
        }

        strong {
            font-weight: 600;
        }

        .important-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 12px;
            margin: 12px 0;
            border-radius: 4px;
        }

        .tree-option {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .tree-option strong {
            color: #C75B39;
        }

        .tree-option small {
            color: #6b7280;
            display: block;
            margin-top: 4px;
        }

        .progress-indicator {
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        .progress-bar {
            background: #e5e7eb;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #C75B39 0%, #A64B2E 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        @media (max-width: 640px) {
            button {
                min-height: 52px;
                font-size: 16px;
            }

            .message-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Phoenix Tree Grant</h1>
            <p>Canopy Tree Care Program</p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-area" id="inputArea"></div>
    </div>

    <script src="tree-grant.js"></script>
</body>
</html>
